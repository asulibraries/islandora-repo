id: self_deposit
title: 'Share Your Work'
description: 'Form for faculty, staff, and students to self deposit their work into KEEP'
categories: {  }
elements: |-
  into_text:
    '#type': processed_text
    '#text': '<p>Thank you for your interest in depositing works to KEEP. Please use this form to provide as much information as possible about the work you are submitting, and only describe one work per form submission. This information will help streamline the process to publish your work in KEEP. &nbsp;</p><p>If this deposit is for a new or different collection than previous works you have submitted, please instead use the "<a href="/form/new-collection-request">New Collection Request</a>" form to initiate the process. If you have any questions about the KEEP deposit process or if your submission includes research data, please contact the <a href="https://lib.asu.edu/research/contact">Researcher Support</a> team.</p>'
    '#format': full_html
  about_your_item_page:
    '#type': webform_wizard_page
    '#title': 'About your item'
    '#open': true
    material_type:
      '#type': webform_checkboxes_other
      '#title': 'What material are you depositing?'
      '#options':
        'Preprint/Research article ': 'Preprint/Research article '
        Presentation: Presentation
        'Book chapter': 'Book chapter'
        Book/Monograph: Book/Monograph
        'Audiovisual material': 'Audiovisual material'
      '#other__option_label': Other
      '#other__placeholder': 'please describe'
      '#required': true
    doi:
      '#type': textfield
      '#title': 'Enter external DOI if applicable'
      '#pattern': '(.*)(10\.\d+\/[\d\w\-\._;()\/#<>:]+)'
      '#pattern_error': 'This DOI does not appear to be valid.'
    suggested_collection:
      '#type': webform_entity_select
      '#title': 'KEEP Collection'
      '#description': '<p>If you know the name of the collection your material belongs with, please enter it here.</p>'
      '#select2': true
      '#target_type': node
      '#selection_handler': 'default:node'
      '#selection_settings':
        target_bundles:
          collection: collection
        sort:
          field: title
          direction: ASC
    item_title:
      '#type': textarea
      '#title': Title
      '#description': '<p>The title of the item</p>'
      '#rows': 2
      '#required': true
    recommended_citation:
      '#type': textarea
      '#title': 'Recommended Citation'
    item_description:
      '#type': textarea
      '#title': Description/Abstract
      '#description': '<p>A description of the item. This could be an abstract or a table of contents.</p>'
      '#required': true
    creation_date:
      '#type': textfield
      '#title': 'Creation Date'
      '#description': '<p>If published, please indicate that date in this field.</p><p>If &nbsp;NOT published, please indicate the date of creation for the item. &nbsp;Do NOT use the date added to KEEP in this field.</p><p><span>If you know the full date, enter it in this format: YYYY-MM-DD. If you know the month and year, enter it in this format: YYYY-MM. If you only know the year, enter it in this format: YYYY.</span></p>'
      '#required': true
      '#pattern': '^[0-9]{4}(-[0-9]{2}(-[0-9]{2})?)?$'
      '#pattern_error': 'Date must be in YYYY-MM-DD format where at least the year is required.'
    keywords:
      '#type': textfield
      '#title': Keywords
      '#multiple': true
      '#description': 'Please describe the topics that this item is about.'
      '#multiple__item_label': keyword
      '#multiple__no_items_message': 'No keywords entered. Please add items below.'
      '#multiple__sorting': false
      '#multiple__add_more': false
      '#multiple__add_more_input': false
      '#multiple__add_more_input_label': 'more keywords'
    contributors:
      '#type': textfield
      '#title': Contributors
      '#multiple': true
      '#description': 'Please provide the names of any person or entity who made a contribution to this resource (including yourself).'
      '#multiple__item_label': contributor
      '#multiple__no_items_message': 'No contributors entered. Please add items below.'
      '#multiple__sorting': false
      '#multiple__add_more': false
      '#multiple__add_more_input': false
      '#multiple__add_more_input_label': 'more contributors'
      '#required': true
    asu_unit:
      '#type': textfield
      '#title': 'ASU unit'
      '#description': 'Please provide us with the ASU unit you are associated with.'
    reuse_permissions:
      '#type': webform_term_select
      '#title': 'Reuse Permissions'
      '#description': '<p><a href="https://keep.lib.asu.edu/about/copyright">Learn more about your copyright options.</a></p>'
      '#default_value': '1090'
      '#vocabulary': reuse_permissions
      '#breadcrumb_delimiter': ''
    embargo_release_date:
      '#type': date
      '#title': 'Embargo Release Date'
      '#description': 'If this item is under embargo, please enter the embargo release date.'
      '#date_date_format': ''
    item_node:
      '#type': value
      '#title': 'Item Node'
    dataset:
      '#type': textarea
      '#title': 'If there is related research data, how will related data be archived and shared?'
      '#description': '<p>Include name of repository where data are stored.</p><p><a href="https://libguides.asu.edu/data/dataverse">Learn more about research datasets and the ASU Research Data Repository.</a></p>'
      '#title_display': before
      '#description_display': after
    peer_reviewed:
      '#type': checkbox
      '#title': 'Peer Reviewed?'
  add_files:
    '#type': webform_wizard_page
    '#title': 'Add files'
    '#open': true
    file:
      '#type': managed_file
      '#title': Files
      '#multiple': true
      '#required': true
      '#unique': true
      '#unique_entity': true
      '#uri_scheme': private
      '#file_extensions': 'gif jpg jpeg png bmp eps tif pict psd txt rtf html odf pdf doc docx ppt pptx xls xlsx xml avi mov mp3 ogg wav bz2 dmg gz jar rar sit svg tar zip txt rtf pdf doc docx odt ppt pptx odp xls xlsx ods mp3 ogg wav gif jpg jpeg png avi mov mp4 ogg wav webm'
      '#sanitize': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
