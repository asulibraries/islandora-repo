id: askalib_ticket
title: 'Request a Submission Consultation'
description: ''
categories: {  }
elements: |-
  request_a_consultation:
    '#type': webform_wizard_page
    '#title': 'Request a consultation'
    what_type_of_content:
      '#type': select
      '#title': 'What type of content?'
      '#options':
        article: Article
        unit: 'Unit/Center Work'
        research: 'Research/Lab Group'
        data: 'Data Only'
      '#required': true
    rdr:
      '#type': webform_markup
      '#states':
        visible:
          ':input[name="what_type_of_content"]':
            value: data
      '#display_on': both
      '#markup': '<p>Please submit research data to the <a href="https://dataverse.asu.edu/">Research Data Repository</a>.</p>'
  article:
    '#type': webform_wizard_page
    '#title': Article
    '#states':
      visible:
        ':input[name="what_type_of_content"]':
          value: article
    article_where_published:
      '#type': textfield
      '#title': 'Where is the article going to be published?'
    article_associated_data:
      '#type': checkbox
      '#title': 'Is there associated data?'
    have_you_published_your_data:
      '#type': checkbox
      '#title': 'Have you published your data?'
      '#states':
        visible:
          ':input[name="article_associated_data"]':
            checked: true
  unit_center_work:
    '#type': webform_wizard_page
    '#title': 'Unit/Center Work'
    '#states':
      visible:
        ':input[name="what_type_of_content"]':
          value: unit
    unit_center_name:
      '#type': textfield
      '#title': 'Unit/Center Name'
      '#required': true
    unity_center_what_type_of_work:
      '#type': textfield
      '#title': 'What type of work?'
    publication_deadline:
      '#type': textfield
      '#title': 'Publication Deadline'
      '#description': '<p>Is there a publication timeline or deadline that we should know about? This does not guarantee that we will be able to meet the timeline.</p>'
  research_lab_group:
    '#type': webform_wizard_page
    '#title': 'Research/Lab Group'
    '#states':
      visible:
        ':input[name="what_type_of_content"]':
          value: research
    rgl_name:
      '#type': textfield
      '#title': 'Research Group/Lab Name'
      '#required': true
    rgl_what_type_of_work:
      '#type': textfield
      '#title': 'What type of work?'
    rgl_number_of_works:
      '#type': number
      '#title': 'Number of works'
    rgl_research_data:
      '#type': checkbox
      '#title': 'Do you also have research data?'
    rgl_members:
      '#type': textfield
      '#title': Member(s)
      '#multiple': true
    rgl_publication_deadline:
      '#type': textfield
      '#title': 'Publication Deadline'
      '#description': '<p>Is there a publication timeline or deadline that we should know about? This does not guarantee that we will be able to meet the timeline.</p>'
  schedule_consultation:
    '#type': webform_wizard_page
    '#title': 'Schedule Consultation'
    article_calendar_note:
      '#type': processed_text
      '#text': '<div class="display-2">Schedule a consultation</div><p>In order to proceed, we will need to have a brief 15 minute consultation regarding your deposit. Please select a time that works with your availability and you will receive a calendar invitation. We look forward to meeting with you!</p><p><iframe style="border-width:0;" src="https://outlook.office.com/book/ASULibraryResearchDataServices@arizonastateu.onmicrosoft.com/s/KsppFv3LFkiHbxh7L73FJQ2" width="100%" height="800rem" scrolling="yes"></iframe></p>'
      '#format': full_html
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      disabled:
        ':input[name="what_type_of_content"]':
          value: data
